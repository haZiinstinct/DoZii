# Abhaengigkeits-Updates als Pull Requests (kostenlos fuer oeffentliche Repos).
# Minor- und Patch-Updates kommen gebuendelt, Majors einzeln - die brauchen
# ohnehin einen eigenen Blick (Electron: siehe H1 im Fehlerbericht 1.3.8).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
