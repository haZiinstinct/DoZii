name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: Tests nutzen das eingebaute node:sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nur Produktions-Abhaengigkeiten: Electron & Co. sind devDependencies und
      # werden gesondert angehoben (H1). Schwelle 'critical', solange xlsx
      # (high, ohne Fix im npm-Register) noch drin ist - nach H2 auf 'high' heben.
      - name: Sicherheitsaudit
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Der Eval-Harness braucht ein laufendes Ollama und wird deshalb in CI
      # nicht ausgefuehrt. Hier wird nur geprueft, dass er sich sauber laedt und
      # sich ohne Ollama selbst ueberspringt, statt rot zu werden.
      - name: Eval-Harness laedt (ohne Ollama = uebersprungen)
        run: npm run eval
